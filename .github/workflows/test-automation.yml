name: QA Automation & Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-automation:
    name: Run Automated API & E2E Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm install

      - name: Install Backend Dependencies
        run: cd backend && npm install

      - name: Install Frontend Dependencies
        run: cd frontend && npm install

      - name: Install Automation Test Dependencies
        run: cd automation-tests && npm install

      - name: Run Backend REST API Automated Tests
        run: cd backend && npm test

      - name: Build Frontend Application
        run: cd frontend && npm run build

      - name: Start Backend API Server
        run: |
          cd backend
          npm start &
        env:
          PORT: 5000
          NODE_ENV: test
          DB_DIALECT: sqlite

      - name: Start Frontend Server
        run: |
          cd frontend
          npm run preview -- --port 5173 &

      - name: Wait for Services to be Healthy
        run: |
          npx wait-on http://localhost:5000/api/health
          npx wait-on http://localhost:5173

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Automation Dependencies
        run: |
          cd automation-tests-python
          pip install -r requirements.txt

      - name: Run Python Selenium WebDriver E2E Automated Tests (Headless)
        run: |
          cd automation-tests-python
          python run_tests.py
        env:
          HEADLESS: 'true'
          BASE_URL: 'http://localhost:5173'

      - name: Upload Python Test HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-selenium-html-report
          path: automation-tests-python/reports/
          retention-days: 14

      - name: Upload Test Failure Screenshots (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-failure-screenshots
          path: automation-tests/reports/screenshots/
          retention-days: 7

